<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il fumetto del mese</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1c2c; --bg2:#262b44; --ink:#f4f4f4; --accent:#ffcd75; --hot:#ef7d57;
  --green:#a7f070; --body:#b0b0c0; --dark:#0f1020; --shadow:#000;
  --sw:max(150px,min(calc(100vw - 72px),calc((100svh - 470px)*.75),380px));
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Press Start 2P","Courier New",monospace; font-size:10px; line-height:1.6;
  image-rendering:pixelated; -webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--bg2) 2px,transparent 2px),linear-gradient(90deg,var(--bg2) 2px,transparent 2px);
  background-size:32px 32px;
}
.app{min-height:100svh;max-width:480px;margin:0 auto;padding:14px 18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px}
.brand{text-align:center;color:var(--accent);font-size:12px;text-shadow:3px 3px 0 var(--shadow)}
.brand small{display:block;color:var(--body);font-size:8px;margin-top:6px;text-shadow:none}

/* schermo */
.tv{width:fit-content;max-width:100%;background:#3b3f5c;border:4px solid var(--shadow);padding:8px;box-shadow:6px 6px 0 var(--shadow)}
.screen{position:relative;width:var(--sw);height:calc(var(--sw)*4/3);background:var(--dark);border:4px solid var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.22) 2px 4px)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto;display:none}
.msg{padding:14px;color:var(--green);font-size:9px}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.bar{display:none;width:70%;height:18px;border:4px solid var(--ink);padding:2px}
.bar i{display:block;height:100%;width:0;background:var(--green)}
.loading .bar{display:block}
.loading .bar i{animation:fill .5s steps(8,end) forwards}
@keyframes fill{to{width:100%}}
.loading .msg,.done .msg{display:none}
.loading .bar+.lt{display:block}
.lt{display:none;position:absolute;bottom:14px;left:0;right:0;font-size:8px;color:var(--green)}
.done canvas{display:block}
.screen.done::after{display:none}

/* console e cartucce */
.deck{position:relative;width:100%;max-width:340px;height:210px}
.carts{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;justify-content:center;z-index:1}
.cart{position:relative;flex:1;max-width:104px;height:96px;background:#6b6e8a;border:4px solid var(--shadow);box-shadow:4px 4px 0 var(--shadow);cursor:pointer;padding:0;font:inherit;color:inherit;transition:transform .3s steps(6,end);animation:bob 1.2s steps(2,end) infinite}
.cart:nth-child(2){animation-delay:.4s}.cart:nth-child(3){animation-delay:.8s}
.cart::before{content:"";position:absolute;left:8px;right:8px;bottom:-4px;height:8px;background:var(--accent);border:4px solid var(--shadow)}
.lab{position:absolute;left:8px;right:8px;top:8px;height:56px;background:var(--c);border:4px solid var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;font-size:7px;line-height:1.6;color:#fff;text-shadow:2px 2px 0 var(--shadow)}
.cart:focus-visible{outline:4px solid var(--accent);outline-offset:4px}
@keyframes bob{50%{margin-top:-6px}}
.cart.sel{animation:none;cursor:default;z-index:2}
.console{position:absolute;left:0;right:0;bottom:0;height:80px;z-index:2;background:#8b93af;border:4px solid var(--shadow);box-shadow:6px 6px 0 var(--shadow)}
.console::before{content:"";position:absolute;left:50%;top:-4px;width:116px;height:12px;margin-left:-58px;background:var(--dark);border:4px solid var(--shadow);border-top:0}
.led{position:absolute;right:16px;bottom:14px;width:14px;height:14px;background:#5a2b2b;border:3px solid var(--shadow)}
.on .led{background:var(--green);box-shadow:0 0 0 3px rgba(167,240,112,.35)}
.pad{position:absolute;left:18px;bottom:14px;width:40px;height:40px}
.pad::before,.pad::after{content:"";position:absolute;background:#3b3f5c;border:3px solid var(--shadow)}
.pad::before{left:0;top:13px;width:40px;height:14px}
.pad::after{left:13px;top:0;width:14px;height:40px}

/* titolo */
.dialog{width:100%;max-width:340px;min-height:66px;background:var(--dark);border:4px solid var(--ink);outline:4px solid var(--shadow);padding:12px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px}
.dialog .k{color:var(--accent);font-size:8px}
.dialog .t{font-size:12px;line-height:1.7;word-break:break-word;min-height:1.7em}
.hint{color:var(--accent);font-size:9px;text-align:center}
.foot{margin-top:auto;padding-top:8px;text-align:center;color:var(--body);font-size:8px;line-height:1.9}
.foot b{color:var(--ink);font-weight:normal}
@supports not (height:100svh){:root{--sw:max(150px,min(calc(100vw - 72px),calc((100vh - 470px)*.75),380px))}.app{min-height:100vh}}
@media (prefers-reduced-motion:reduce){.cart,.blink{animation:none}.cart{transition:none}.loading .bar i{animation-duration:.01s}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="brand"><span id="shop">LA TUA FUMETTERIA</span><small>SCEGLI UNA CARTUCCIA</small></header>

  <section class="tv" aria-live="polite">
    <div class="screen" id="screen">
      <div class="msg blink" id="msg">INSERISCI<br>LA CARTUCCIA</div>
      <div class="bar"><i></i></div><div class="lt">CARICAMENTO...</div>
      <canvas id="cv" width="720" height="960" aria-label="Copertina del fumetto del mese"></canvas>
    </div>
  </section>

  <div class="dialog" id="dialog">
    <span class="k" id="k">LA TUA LETTURA</span>
    <span class="t" id="title">???</span>
  </div>

  <div class="deck" id="deck">
    <div class="carts" id="carts">
      <button class="cart" data-i="0" style="--c:#ef7d57" aria-label="Fumetto del mese"><span class="lab">FUMETTO<br>DEL MESE</span></button>
      <button class="cart" data-i="1" style="--c:#41a6f6" aria-label="Autore del mese"><span class="lab">AUTORE<br>DEL MESE</span></button>
      <button class="cart" data-i="2" style="--c:#38b764" aria-label="Uscite anteprima"><span class="lab">USCITE<br>ANTEPRIMA</span></button>
    </div>
    <div class="console"><span class="pad"></span><span class="led"></span></div>
  </div>
  <p class="hint blink" id="hint">&#9650; TOCCA UNA CARTUCCIA</p>

  <footer class="foot" id="foot">
    <b id="gruppo">Gruppo lettura ogni mercoledì, ore 18.00 - Fumetteria Eta Beta - Via Palazzola, 43/A, 47121 Forlì FC</b>
  </footer>
</main>

<script>
/* #########################################################################
   ## DA AGGIORNARE OGNI MESE: TITOLI E LINK ALLE COPERTINE
   ##
   ## categoria = scritta sopra il titolo (non cambia)
   ## titolo    = testo mostrato sotto lo schermo
   ## copertina = link all'immagine, formato verticale 3:4
   ##             (quelli sotto sono segnaposto: sostituiscili con i link reali)
   ##             Se il link manca o non si carica, compare un segnaposto pulito con il titolo.
   ######################################################################### */
const LETTURE = [
  { categoria:"FUMETTO DEL MESE",  titolo:"WATCHMEN",       copertina:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2ILdSffl1UYSzlcTYTgdtm_uupJp-EYvEGrxpSaoNe2AvCFt-HkNpMv-M&s=10" },
  { categoria:"AUTORE DEL MESE",   titolo:"JIRO TANIGUCHI", copertina:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQkC4GCOBeNjD2-H469reN6H1TOoNnWeTtEhfLD_-YH0va2T69SKYpI7qA&s=10" },
  { categoria:"USCITE ANTEPRIMA",  titolo:"AKIRA",          copertina:"https://m.media-amazon.com/images/I/71V54jX0fML._AC_UF1000,1000_QL80_.jpg" }
];
/* ######################## FINE PARTE DA AGGIORNARE ####################### */

const CONFIG = {
  negozio:  "I CONSIGLI DI ETA BETA",
  orari:    "Dal martedì al sabato, 10:00 alle 19:30",
  indirizzo:"Via dei Fumetti 1, Città"
};

const $ = id => document.getElementById(id);
$("shop").textContent = CONFIG.negozio;

const cv = $("cv"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height;

/* ---- segnaposto pulito, usato solo se il link della copertina manca o non si carica ---- */
function placeholder(i){
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d");
  const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#262b44"); bg.addColorStop(1,"#0f1020");
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  g.textAlign="center"; g.textBaseline="middle";
  g.fillStyle="#b0b0c0"; g.font="600 34px sans-serif";
  g.fillText(LETTURE[i].categoria,W/2,H*0.36);
  g.fillStyle="#ffcd75"; g.font="800 64px sans-serif";
  const lines=[]; let row="";
  LETTURE[i].titolo.split(" ").forEach(w=>{ const t=row?row+" "+w:w; if(row && g.measureText(t).width>W-80){ lines.push(row); row=w; } else row=t; });
  lines.push(row);
  lines.forEach((t,k)=>g.fillText(t,W/2,H*0.5+(k-(lines.length-1)/2)*78));
  return c;
}

function load(i){
  return new Promise(res=>{
    const url = LETTURE[i].copertina;
    if(!url) return res(placeholder(i));
    const im = new Image();
    im.onload = ()=>res(im);
    im.onerror = ()=>res(placeholder(i));
    im.src = url;
  });
}

function drawCover(src){
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  const k = Math.max(W/sw, H/sh), w = sw*k, h = sh*k;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(src,(W-w)/2,(H-h)/2,w,h);
}

let typeId = null;
function type(el, text, speed=40){
  clearInterval(typeId); el.textContent = ""; let i = 0;
  typeId = setInterval(()=>{ el.textContent = text.slice(0,++i); if(i>=text.length) clearInterval(typeId); }, speed);
}

let busy = false, current = -1;
const carts = [...document.querySelectorAll(".cart")];

async function select(i){
  if(busy || i===current) return;
  busy = true;
  const screen = $("screen"), deck = $("deck");
  if(current>=0){ carts[current].style.transform = ""; carts[current].classList.remove("sel"); }
  current = i;
  const cart = carts[i];
  const dr = deck.getBoundingClientRect(), cr = cart.getBoundingClientRect();
  const dx = (dr.left+dr.width/2) - (cr.left+cr.width/2);
  cart.classList.add("sel");
  cart.style.transform = "translate("+dx+"px,96px)";
  deck.classList.add("on");
  $("hint").textContent = "\u25B2 TOCCA UN\u2019ALTRA PER CAMBIARE";
  $("hint").classList.remove("blink");
  clearInterval(typeId); $("title").textContent = "...";
  $("k").textContent = LETTURE[i].categoria;
  screen.classList.remove("done","loading");
  const t0 = performance.now();
  const imgPromise = load(i);
  setTimeout(()=>{ void screen.offsetWidth; screen.classList.add("loading"); }, 300);
  const src = await imgPromise;
  setTimeout(()=>{
    screen.classList.remove("loading"); screen.classList.add("done");
    drawCover(src);
    setTimeout(()=>{ type($("title"), LETTURE[i].titolo); busy = false; }, 150);
  }, Math.max(0, 800 - (performance.now() - t0)));
}
carts.forEach((c,i)=>c.addEventListener("click",()=>select(i)));
</script>
</body>
</html>
