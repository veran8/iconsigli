<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Consigli del Nerd</title>
    <!-- Font RPG Pixel Art -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-village: #2c3e50;
            --bg-pattern: #233140;
            --parchment: #f7ebd2;
            --parchment-shadow: #dfd0b0;
            --wood-border: #5c3317;
            --gold: #f39c12;
            --gold-bright: #f1c40f;
            --text-dark: #2c1606;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-village);
            /* Pattern pavimentazione RPG 16-bit */
            background-image: 
                radial-gradient(var(--bg-pattern) 20%, transparent 20%),
                radial-gradient(var(--bg-pattern) 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--text-dark);
            font-family: 'Press Start 2P', cursive;
            padding: 20px 14px 30px 14px;
            max-width: 460px;
            margin: 0 auto;
        }

        .pixel-svg {
            shape-rendering: crispEdges;
            display: block;
            margin: 0 auto;
        }

        /* Header Stile Insegna Locanda / Fumetteria RPG */
        header {
            background-color: var(--wood-border);
            border: 4px solid var(--gold-bright);
            outline: 4px solid #000;
            box-shadow: 0 8px 0 rgba(0,0,0,0.45);
            padding: 20px 12px;
            text-align: center;
            margin-bottom: 52px;
            position: relative;
        }

        h1 {
            font-size: 1.15rem;
            color: var(--gold-bright);
            text-shadow: 3px 3px 0 #000;
            line-height: 1.5;
            text-transform: uppercase;
        }

        /* Schede stile Dialogo / Pergamena RPG */
        .rpg-card {
            background-color: var(--parchment);
            border: 4px solid var(--wood-border);
            outline: 4px solid #000;
            box-shadow: 
                inset 0 0 0 4px var(--parchment-shadow),
                0 10px 0 rgba(0,0,0,0.4);
            padding: 0 16px 22px 16px;
            margin-bottom: 52px;
            text-align: center;
            position: relative;
        }

        .rpg-card:last-child {
            margin-bottom: 10px;
        }

        /* Targhetta Sezione perfettamente centrata sul bordo */
        .section-banner {
            background-color: var(--wood-border);
            color: #fff;
            font-size: 0.68rem;
            padding: 10px 14px;
            border: 3px solid var(--gold-bright);
            outline: 3px solid #000;
            display: inline-block;
            width: auto;
            max-width: 88%;
            transform: translateY(-50%);
            margin-bottom: -6px;
            text-transform: uppercase;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
            line-height: 1.5;
        }

        /* Area Personaggio centrata */
        .sprite-reader {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }

        /* Cornice della Copertina */
        .cover-frame {
            width: 75%;
            max-width: 215px;
            margin: 0 auto 16px auto;
            border: 4px solid #000;
            outline: 4px solid var(--gold);
            background-color: #1a1a1a;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .cover-frame img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
        }

        /* Titolo del Fumetto */
        .comic-title {
            font-size: 0.85rem;
            color: var(--text-dark);
            line-height: 1.5;
            margin-top: 10px;
            padding: 10px 8px;
            background-color: rgba(255,255,255,0.55);
            border: 2px dashed var(--wood-border);
        }
    </style>
</head>
<body>

    <!-- # titolo -->
    <header>
        <h1>I Consigli del Nerd</h1>
    </header>

    <main>
        <!-- # TITOLO DEL MESE -->
        <section class="rpg-card">
            <h2 class="section-banner">Titolo del Mese</h2>
            
            <!-- Personaggio 1: Nerd con occhiali e felpa rossa che legge un manga -->
            <div class="sprite-reader">
                <svg class="pixel-svg" width="56" height="56" viewBox="0 0 16 16">
                    <path fill="#4a2e1b" d="M4,1 h8 v2 h1 v2 h-1 v-1 h-8 v1 h-1 v-2 h1 z"/>
                    <path fill="#ffdbac" d="M4,4 h8 v5 h-8 z"/>
                    <path fill="#000" d="M3,5 h10 v1 h-1 v2 h-3 v-2 h-2 v2 h-3 v-2 h-1 z"/>
                    <path fill="#a2d9ff" d="M5,6 h2 v1 h-2 z M9,6 h2 v1 h-2 z"/>
                    <path fill="#d9381e" d="M3,9 h10 v6 h-10 z"/>
                    <path fill="#000" d="M2,10 h12 v5 h-12 z"/>
                    <path fill="#2ecc71" d="M3,11 h4 v3 h-4 z"/>
                    <path fill="#ecf0f1" d="M7,11 h1 v3 h-1 z"/>
                    <path fill="#fff" d="M8,11 h5 v3 h-5 z"/>
                    <path fill="#ffdbac" d="M2,12 h1 v2 h-1 z M13,12 h1 v2 h-1 z"/>
                </svg>
            </div>

            <div class="cover-frame">
                <img src="https://covers.openlibrary.org/b/isbn/9781569319017-L.jpg" 
                     referrerpolicy="no-referrer"
                     onerror="this.src='https://placehold.co/400x600/d9381e/ffffff?text=One+Piece+Vol.1'" 
                     alt="Copertina Titolo del Mese">
            </div>
            <h3 class="comic-title">One Piece - Edizione Star Comics</h3>
        </section>

        <!-- # UN CONSIGLIO DA "ANTEPRIMA" -->
        <section class="rpg-card">
            <h2 class="section-banner">Un consiglio da "Anteprima"</h2>

            <!-- Personaggio 2: Ragazza Nerd con cuffie e capelli blu che legge -->
            <div class="sprite-reader">
                <svg class="pixel-svg" width="56" height="56" viewBox="0 0 16 16">
                    <path fill="#f1c40f" d="M3,1 h10 v1 h1 v5 h-2 v-4 h-8 v4 h-2 v-5 h1 z"/>
                    <path fill="#8e44ad" d="M4,2 h8 v3 h-8 z M3,7 h1 v4 h-1 z M12,7 h1 v4 h-1 z"/>
                    <path fill="#ffdbac" d="M4,5 h8 v4 h-8 z"/>
                    <path fill="#000" d="M5,6 h1 v2 h-1 z M10,6 h1 v2 h-1 z"/>
                    <path fill="#1abc9c" d="M4,9 h8 v6 h-8 z"/>
                    <path fill="#000" d="M2,10 h12 v5 h-12 z"/>
                    <path fill="#9b59b6" d="M3,11 h5 v3 h-5 z"/>
                    <path fill="#fff" d="M8,11 h5 v3 h-5 z"/>
                    <path fill="#ffdbac" d="M2,12 h1 v2 h-1 z M13,12 h1 v2 h-1 z"/>
                </svg>
            </div>

            <div class="cover-frame">
                <img src="https://covers.openlibrary.org/b/isbn/9781401232597-L.jpg" 
                     referrerpolicy="no-referrer"
                     onerror="this.src='https://placehold.co/400x600/2c3e50/f1c40f?text=Batman:+Il+Lungo+Halloween'" 
                     alt="Copertina Consiglio da Anteprima">
            </div>
            <h3 class="comic-title">Batman: Il Lungo Halloween (Deluxe)</h3>
        </section>

        <!-- # AUTORE DEL MESE -->
        <section class="rpg-card">
            <h2 class="section-banner">Autore del Mese</h2>

            <!-- Personaggio 3: Il Fumettaro saggio con barba e cappellino -->
            <div class="sprite-reader">
                <svg class="pixel-svg" width="56" height="56" viewBox="0 0 16 16">
                    <path fill="#e74c3c" d="M4,1 h8 v2 h3 v1 h-11 z"/>
                    <path fill="#fff" d="M6,1 h4 v1 h-4 z"/>
                    <path fill="#ffdbac" d="M4,4 h8 v4 h-8 z"/>
                    <path fill="#000" d="M4,5 h8 v1 h-1 v1 h-2 v-1 h-2 v1 h-2 v-1 h-1 z"/>
                    <path fill="#5c3317" d="M4,7 h8 v3 h-2 v1 h-4 v-1 h-2 z"/>
                    <path fill="#2980b9" d="M3,10 h10 v5 h-10 z"/>
                    <path fill="#000" d="M2,10 h12 v5 h-12 z"/>
                    <path fill="#e67e22" d="M3,11 h5 v3 h-5 z"/>
                    <path fill="#fff" d="M8,11 h5 v3 h-5 z"/>
                    <path fill="#ffdbac" d="M2,12 h1 v2 h-1 z M13,12 h1 v2 h-1 z"/>
                </svg>
            </div>

            <div class="cover-frame">
                <img src="https://covers.openlibrary.org/b/isbn/9781401245252-L.jpg" 
                     referrerpolicy="no-referrer"
                     onerror="this.src='https://placehold.co/400x600/f39c12/000000?text=Alan+Moore+-+Watchmen'" 
                     alt="Copertina Autore del Mese">
            </div>
            <h3 class="comic-title">Alan Moore (Watchmen)</h3>
        </section>
    </main>

</body>
</html>
